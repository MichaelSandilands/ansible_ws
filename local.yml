---
- name: Provision Local Tuxedo Computer (Fedora)
  hosts: localhost
  become: true
  vars:
    # Ensures we target your actual user even when running with sudo
    target_user: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    target_home: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
    fedora_version: "{{ ansible_distribution_major_version }}"

  pre_tasks:
    - name: Update all system packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Add Tuxedo Computers repository
      ansible.builtin.get_url:
        url: "https://rpm.tuxedocomputers.com/fedora/tuxedo.repo"
        dest: /etc/yum.repos.d/tuxedo.repo
        mode: "0644"

    - name: Import Tuxedo Computers GPG key
      ansible.builtin.rpm_key:
        key: "https://rpm.tuxedocomputers.com/fedora/{{ fedora_version }}/0x54840598.pub.asc"
        state: present

    - name: Add Docker CE repository
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/fedora/docker-ce.repo"
        dest: /etc/yum.repos.d/docker-ce.repo
        mode: "0644"

    - name: Import Docker CE GPG key
      ansible.builtin.rpm_key:
        key: "https://download.docker.com/linux/fedora/gpg"
        state: present

    - name: Install RPM Fusion repositories
      ansible.builtin.dnf:
        name:
          - "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_version }}.noarch.rpm"
          - "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_version }}.noarch.rpm"
        state: present
        disable_gpg_check: true

    - name: Import RPM Fusion GPG keys from local disk
      ansible.builtin.rpm_key:
        key: "{{ item }}"
        state: present
      loop:
        - "/etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-free-fedora-{{ fedora_version }}"
        - "/etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-nonfree-fedora-{{ fedora_version }}"

    - name: Enable fedora-cisco-openh264 repository
      community.general.ini_file:
        path: /etc/yum.repos.d/fedora-cisco-openh264.repo
        section: fedora-cisco-openh264
        option: enabled
        value: "1"
        mode: "0644"
        no_extra_spaces: true

    - name: Enable R, Quarto, Starship Prompt & WezTerm
      community.general.copr:
        name:
          - atim/starship
          - iucar/rstudio
          - wez/wezterm
        state: enabled

    - name: Install System and Dev Packages
      ansible.builtin.dnf:
        state: present
        name:
          # Tuxedo Specific
          - tuxedo-control-center
          - tuxedo-drivers
          - tuxedo-tomte-light
          # Terminal & Fonts
          - cascadia-mono-nf-fonts
          - kitty
          - wezterm
          - tmux
          - starship
          # Neovim & Dependencies
          - neovim
          - python3-neovim
          - luarocks
          - ImageMagick
          - compat-lua
          - gcc # C compiler for nvim-treesitter parser compilation
          - make # build step for telescope-fzf-native
          - wl-clipboard # Wayland clipboard provider (nvim uses clipboard=unnamedplus)
          # Nvidia (Drivers + CUDA for LLM & Data Science)
          - akmod-nvidia
          - xorg-x11-drv-nvidia-cuda
          # Docker
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          # Quarto
          - quarto
          # R Core
          # - R
          # R: Tidyverse / Dev Dependencies
          # - openssl-devel
          # - libcurl-devel
          # - libxml2-devel
          # - fontconfig-devel
          # - harfbuzz-devel
          # - fribidi-devel
          # - freetype-devel
          # - libpng-devel
          # - libtiff-devel
          # - libjpeg-turbo-devel
          # - cmake
          # - gcc-c++
          # R: Geospatial (sf/terra)
          # - gdal-devel
          # - proj-devel
          # - geos-devel
          # - sqlite-devel
          # - udunits2-devel
          # R: Prophet/V8
          # - v8-devel
          # Gaming
          - steam
          # System Utilities
          - stow
        update_cache: true

  tasks:
    - name: Configure Docker Service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true

    # - name: Ensure R user library exists
    #   ansible.builtin.file:
    #     path: "{{ target_home }}/R/library"
    #     state: directory
    #     owner: "{{ target_user }}"
    #     group: "{{ target_user }}"
    #     mode: "0755"

    # - name: Install R packages for user
    #   ansible.builtin.command:
    #     cmd: >
    #       Rscript -e "
    #         .libPaths(c('~/R/library', .libPaths()));
    #         pkgs <- c('tidyverse', 'tidymodels', 'modeltime', 'timetk');
    #         missing <- pkgs[!pkgs %in% installed.packages()[,'Package']];
    #         if (length(missing)) install.packages(missing, repos='https://cloud.r-project.org', lib='~/R/library')
    #       "
    #   become_user: "{{ target_user }}"
    #   register: r_install
    #   changed_when: "'installing' in (r_install.stderr | lower)"

    # - name: Install devcontainer CLI globally
    #   community.general.npm:
    #     name: "@devcontainers/cli"
    #     global: true

    # ---------------------------------------------------
    # Install & Update Astral's uv
    # ---------------------------------------------------
    - name: Check if uv is installed
      ansible.builtin.command: command -v uv
      become_user: "{{ target_user }}"
      register: uv_check
      changed_when: false
      failed_when: false

    - name: Install uv (if missing)
      ansible.builtin.shell: "curl -LsSf https://astral.sh/uv/install.sh | sh"
      become_user: "{{ target_user }}"
      when: uv_check.rc != 0

    - name: Update uv (if installed)
      ansible.builtin.command: "{{ target_home }}/.local/bin/uv self update"
      become_user: "{{ target_user }}"
      register: uv_update
      changed_when: "'up to date' not in uv_update.stdout"
      when: uv_check.rc == 0

    # ---------------------------------------------------
    # Install & Update Ollama
    # ---------------------------------------------------
    - name: Install or Update Ollama
      ansible.builtin.shell: "curl -fsSL https://ollama.com/install.sh | sh"
      register: ollama_install
      # The script outputs "Install complete" even on updates. We mark it changed
      # only if it actually downloads a new version (you can tweak this logic).
      changed_when: "'Downloading' in ollama_install.stdout"

  roles:
    - role: ssh_keys
      vars:
        ssh_user: "{{ target_user }}"
        git_user_name: "MichaelSandilands"
        git_user_email: "michael.b.sandilands@gmail.com"
        ssh_keys:
          - name: github_key
            public: github_key.pub
            private: github_key
          # - name: id_ed25519_ec2
          #   public: id_ed25519_ec2.pub
          #   private: id_ed25519_ec2

    - role: dotfiles

    - role: auto_updates
