---
- name: Install dnf5-automatic plugin
  ansible.builtin.dnf:
    name: dnf5-plugin-automatic
    state: present

- name: Deploy dnf-automatic configuration
  ansible.builtin.copy:
    src: automatic.conf
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart dnf5-automatic timer

- name: Ensure dnf5-automatic timer is enabled and started
  ansible.builtin.systemd:
    name: dnf5-automatic.timer
    state: started
    enabled: true
