---
- name: Install dnf5-automatic plugin
  ansible.builtin.dnf:
    name: dnf5-plugin-automatic
    state: present

- name: Deploy dnf-automatic configuration to both legacy and DNF5 paths
  ansible.builtin.copy:
    src: automatic.conf
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - /etc/dnf/automatic.conf
    - /etc/dnf/dnf5-plugins/automatic.conf
  notify: Restart dnf5-automatic timer

- name: Ensure dnf5-automatic timer is enabled and started
  ansible.builtin.systemd:
    name: dnf5-automatic.timer
    state: started
    enabled: true
