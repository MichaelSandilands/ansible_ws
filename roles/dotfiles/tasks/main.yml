---
# 1. Clone your dotfiles repository
- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "https://github.com/MichaelSandilands/dotfiles.git"
    dest: "{{ target_home }}/dotfiles"
    update: true
  become_user: "{{ target_user }}"

# 2. Use Stow to symlink the configurations
- name: Stow dotfiles (kitty, nvim, tmux)
  ansible.builtin.command:
    cmd: "stow -t {{ target_home }} {{ item }}"
    chdir: "{{ target_home }}/dotfiles"
  loop:
    - kitty
    - nvim
    - tmux
  become_user: "{{ target_user }}"
  changed_when: false # Stow handles idempotency internally

# 3. Install Tmux Plugin Manager (TPM)
- name: Ensure tmux plugin manager (tpm) is cloned
  ansible.builtin.git:
    repo: "https://github.com/tmux-plugins/tpm"
    dest: "{{ target_home }}/.tmux/plugins/tpm"
    update: true
  become_user: "{{ target_user }}"

# 4. Headlessly install tmux plugins
- name: Install tmux plugins headlessly
  ansible.builtin.command:
    cmd: "{{ target_home }}/.tmux/plugins/tpm/bin/install_plugins"
  become_user: "{{ target_user }}"
  environment:
    # Set the environment variable so TPM knows where to install
    TMUX_PLUGIN_MANAGER_PATH: "{{ target_home }}/.tmux/plugins/"
  register: tpm_install
  changed_when: "'Installing' in tpm_install.stdout or 'download success' in tpm_install.stdout"

# 5. Create the Neovim Python provider venv and install its dependencies.
#    Neovim's python3_host_prog points at ~/.virtualenvs/neovim (see nvim options.lua),
#    so the provider remote plugins (Molten et al.) load from this venv.
- name: Ensure ~/.virtualenvs directory exists
  ansible.builtin.file:
    path: "{{ target_home }}/.virtualenvs"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  become_user: "{{ target_user }}"

- name: Create the Neovim provider venv and install remote-plugin dependencies
  ansible.builtin.pip:
    # pynvim and jupyter_client are required; the rest power Molten output rendering.
    name:
      - pynvim
      - jupyter_client
      - cairosvg
      - plotly
      - kaleido
      - pnglatex
      - pyperclip
      - nbformat
    # Creates the venv with `python3 -m venv` if it does not exist yet, then installs
    # the packages. Idempotent: pip is a no-op when requirements are already satisfied.
    virtualenv: "{{ target_home }}/.virtualenvs/neovim"
    virtualenv_command: python3 -m venv
  become_user: "{{ target_user }}"

# 6. Initialize Starship in .bashrc (if not already present)
- name: Add Starship initialization to .bashrc
  ansible.builtin.lineinfile:
    path: "{{ target_home }}/.bashrc"
    line: 'eval "$(starship init bash)"'
    state: present
    create: yes
  become_user: "{{ target_user }}"
